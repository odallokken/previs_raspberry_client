# =============================================================================
#  pulse-sdk.conf — where scripts/install.sh downloads the Pexip Pulse SDK from
# =============================================================================
#
#  The Pulse SDK is shipped as .deb packages that are far too large to commit to
#  a git repository.  Instead they are published once as a GitHub Release, and
#  the installer downloads the ones matching the machine's architecture.  This
#  keeps the customer install a plain "git clone + run the installer".
#
#  MAINTAINER: after uploading the packages to a release, fill in the values
#  below.  See the "Publishing the Pulse SDK" section of the README for the
#  full walk-through.
#
# -----------------------------------------------------------------------------

# Base URL that the package files below are appended to.  For a GitHub Release
# this is:
#
#     https://github.com/<owner>/<repo>/releases/download/<tag>
#
# Leave empty to disable downloading (the installer then falls back to
# PULSE_DEB_DIR, sdk/debs/, or a clone of the public doppler repository).
PULSE_SDK_BASE_URL=""

# The package file names for each architecture, space separated.  The names must
# match the files uploaded to the release exactly.  Recent SDK releases are a
# single package, e.g. "pexninja_1.0.18250....ubuntu2404_arm64.deb"; older ones
# listed libpexcommon, libpexpulse and libpexpulse-dev.
#
# 'arm64' is the Raspberry Pi running 64-bit Ubuntu; 'amd64' is a regular
# Intel/AMD PC.  Leave an architecture empty if you do not ship it.
PULSE_SDK_FILES_arm64=""
PULSE_SDK_FILES_amd64=""

# Optional but recommended: the SHA-256 checksum of each file above, in the same
# order.  When set, the installer verifies every download and aborts on a
# mismatch.  Produce them with:  sha256sum *.deb
PULSE_SDK_SHA256_arm64=""
PULSE_SDK_SHA256_amd64=""
