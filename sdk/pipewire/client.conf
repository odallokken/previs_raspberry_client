# =============================================================================
#  client.conf — minimal PipeWire client configuration for previs-client
# -----------------------------------------------------------------------------
#
#  The Pexip Pulse SDK's media backend links against libpipewire.  libpipewire
#  refuses to create a context when it cannot find a "client.conf":
#
#      pw.conf: error loading config '/usr/share/pipewire/client.conf'
#      pw.conf: can't load config client.conf: No such file or directory
#
#  and the SDK then uses the context it failed to create, which kills the
#  client with SIGSEGV as soon as a camera, microphone or speaker is attached.
#
#  That file belongs to the 'libpipewire-0.3-common' package, which is only a
#  *recommendation* of the runtime library the SDK pulls in, so it is missing on
#  a plain Raspberry Pi image.  scripts/install.sh installs the package when it
#  can; this copy is the fallback used when the package is unavailable, and it
#  is deliberately kept to the modules a client (not a daemon) needs.
#
#  The modules below ship with 'libpipewire-0.3-0' itself, so no extra package
#  is required for this configuration to work.
# =============================================================================

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level   = 20
            rt.prio      = 88
            rt.time.soft = 200000
            rt.time.hard = 200000
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
